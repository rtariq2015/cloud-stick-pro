[platformio]
default_envs = tdongle_s3

[env:tdongle_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = tdongles3
framework = arduino
monitor_speed = 115200
build_type = release
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.3
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB160x80=1
    -DTFT_MOSI=3
    -DTFT_MISO=-1
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=LOW
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -fstack-usage
monitor_filters = esp32_exception_decoder

# Review-only setup target: real Wi-Fi and its own NVS keys, fixed private owner
# card required. No default/public owner proof and no production cloud/receipt
# workers. Never selected by default or uploaded by a build helper.
[env:tdongle_s3_wifi_m2]
extends = env:tdongle_s3
build_src_filter =
    +<*>
    -<config_loader.cpp>
    -<diagnostics.cpp>
    -<guest_wifi.cpp>
    -<logger.cpp>
    -<portal.cpp>
    -<pro_http.cpp>
    -<pro_journal.cpp>
    -<setup_identity.cpp>
    -<setup_network.cpp>
    -<sync_engine.cpp>
    -<webdav_client.cpp>
    -<wifi_scan.cpp>
build_flags =
    ${env:tdongle_s3.build_flags}
    -DCSP_ENABLE_BLE_MANAGEMENT=1
    -DCSP_ENABLE_WIFI_SETUP=1
    -Wl,--wrap=nvs_flash_erase
    -Wl,--wrap=nvs_flash_erase_partition

# Read-only prototype. Never selected by default and never uploaded by a script.
[env:tdongle_s3_wifi_m2_bench]
extends = env:tdongle_s3_wifi_m2
build_flags =
    ${env:tdongle_s3_wifi_m2.build_flags}
    -DCSP_USB_BENCH_AUTOMATION=1

# Read-only prototype. Never selected by default and never uploaded by a script.
[env:tdongle_s3_ble_m1_isolated]
extends = env:tdongle_s3
# Production network, configuration, journal and diagnostic implementations are
# absent from this link. The test runtime provides RAM-only status stubs.
build_src_filter =
    +<*>
    -<config_loader.cpp>
    -<diagnostics.cpp>
    -<guest_wifi.cpp>
    -<logger.cpp>
    -<portal.cpp>
    -<pro_http.cpp>
    -<pro_journal.cpp>
    -<setup_identity.cpp>
    -<setup_network.cpp>
    -<sync_engine.cpp>
    -<webdav_client.cpp>
    -<wifi_scan.cpp>
build_flags =
    ${env:tdongle_s3.build_flags}
    -DCSP_ENABLE_BLE_MANAGEMENT=1
    -DCSP_BLE_SYNTHETIC_ONLY=1
    -DCSP_BLE_ISOLATED_TEST=1
    -Wl,--wrap=esp_partition_write
    -Wl,--wrap=esp_partition_write_raw
    -Wl,--wrap=esp_partition_erase_range
    -Wl,--wrap=esp_flash_write
    -Wl,--wrap=esp_flash_write_encrypted
    -Wl,--wrap=esp_flash_erase_region
    -Wl,--wrap=esp_flash_erase_chip

# Diagnostic-only image: all ordinary builds keep allocator interception absent.
[env:tdongle_s3_ble_m1_trace]
extends = env:tdongle_s3_ble_m1_isolated
build_flags =
    ${env:tdongle_s3_ble_m1_isolated.build_flags}
    -DCSP_BLE_ALLOC_TRACE=1
    -Wl,--wrap=malloc
    -Wl,--wrap=calloc
    -Wl,--wrap=realloc
    -Wl,--wrap=free
    -Wl,--wrap=heap_caps_malloc
    -Wl,--wrap=heap_caps_calloc
    -Wl,--wrap=heap_caps_realloc
    -Wl,--wrap=heap_caps_free
    -Wl,--wrap=heap_caps_aligned_alloc
    -Wl,--wrap=heap_caps_aligned_calloc

# Metadata-only allocator observer for owner-authorized, SD-absent local bench.
# No memory payload, credential or file content is read by these hooks.
[env:tdongle_s3_wifi_m2_bench_trace]
extends = env:tdongle_s3_wifi_m2_bench
build_flags =
    ${env:tdongle_s3_wifi_m2_bench.build_flags}
    -DCSP_BLE_ALLOC_TRACE=1
    -Wl,--wrap=malloc
    -Wl,--wrap=calloc
    -Wl,--wrap=realloc
    -Wl,--wrap=free
    -Wl,--wrap=heap_caps_malloc
    -Wl,--wrap=heap_caps_calloc
    -Wl,--wrap=heap_caps_realloc
    -Wl,--wrap=heap_caps_free
    -Wl,--wrap=heap_caps_aligned_alloc
    -Wl,--wrap=heap_caps_aligned_calloc
    -Wl,--wrap=heap_caps_malloc_default
    -Wl,--wrap=_malloc_r
    -Wl,--wrap=_calloc_r
    -Wl,--wrap=_realloc_r
    -Wl,--wrap=_free_r
    -Wl,--wrap=mem_malloc
    -Wl,--wrap=mem_free
    -Wl,--wrap=memp_malloc
    -Wl,--wrap=memp_free
    -Wl,--wrap=multi_heap_malloc
    -Wl,--wrap=multi_heap_realloc
    -Wl,--wrap=multi_heap_free
    -Wl,--wrap=multi_heap_aligned_alloc_offs
    -Wl,--wrap=esp_timer_create

[env:tdongle_s3_wifi_m2_bench_radio]
extends = env:tdongle_s3_wifi_m2_bench
build_flags =
    ${env:tdongle_s3_wifi_m2_bench.build_flags}
    -DCSP_BENCH_RADIO_RELEASE=1
    -DARDUINO_LOOP_STACK_SIZE=12288

# Source-only link budget experiment. Not a usable backup or upload image.
# Keep real worker/TLS code reachable without constructing a worker at runtime.
[env:tdongle_s3_backup_link_probe]
extends = env:tdongle_s3_wifi_m2_bench_radio
build_src_filter =
    +<*>
    -<diagnostics.cpp>
    -<guest_wifi.cpp>
    -<portal.cpp>
    -<pro_http.cpp>
    -<setup_identity.cpp>
    -<setup_network.cpp>
    -<wifi_scan.cpp>
build_flags =
    ${env:tdongle_s3_wifi_m2_bench_radio.build_flags}
    -DCSP_BACKUP_LINK_PROBE=1
    -Wl,--undefined=_Z12start_backupRK11CloudConfig

# Combined prototype: single managed backup worker, private owner setup and
# verified exclusive BLE/TLS lifecycle. Default production remains unchanged.
[env:tdongle_s3_backup_wifi]
extends = env:tdongle_s3_wifi_m2
build_src_filter =
    +<*>
    -<diagnostics.cpp>
    -<guest_wifi.cpp>
    -<portal.cpp>
    -<pro_http.cpp>
    -<setup_identity.cpp>
    -<setup_network.cpp>
    -<wifi_scan.cpp>
build_flags =
    ${env:tdongle_s3_wifi_m2.build_flags}
    -DCSP_ENABLE_BACKUP_SETUP=1
    -DARDUINO_LOOP_STACK_SIZE=12288
    -Wl,--wrap=esp_wifi_init

# Local software-controlled bench opening still requires the private BLE owner
# proof for every mutation. Storage/worker retirement is mandatory with media.
[env:tdongle_s3_backup_wifi_bench]
extends = env:tdongle_s3_backup_wifi
build_flags =
    ${env:tdongle_s3_backup_wifi.build_flags}
    -DCSP_USB_BENCH_AUTOMATION=1

# First media-present hardware acceptance uses only generated fixtures in its
# own local/remote folder. This image must never be labelled normal production.
[env:tdongle_s3_backup_wifi_lab]
extends = env:tdongle_s3_backup_wifi_bench
build_flags =
    ${env:tdongle_s3_backup_wifi_bench.build_flags}
    -DCSP_BACKUP_FIXTURE_ONLY=1

# Staged source/adapter acceptance only. Real venue routing remains unvalidated.
# Default production and the ordinary combined targets keep this feature off.
[env:tdongle_s3_public_wifi_lab]
extends = env:tdongle_s3_backup_wifi_lab
build_flags =
    ${env:tdongle_s3_backup_wifi_lab.build_flags}
    -DCSP_ENABLE_PUBLIC_WIFI_ASSISTANCE=1
    -DCSP_ENABLE_OWNED_GUEST_ROUTE=1

# Reuse the exact frozen mem1 SDK. Build through the SHA-guarded helper only;
# default and ordinary public lab environments retain their stock SDK choices.
[env:tdongle_s3_public_wifi_mem1]
extends = env:tdongle_s3_public_wifi_lab
build_flags =
    ${env:tdongle_s3_public_wifi_lab.build_flags}
    -DCSP_PUBLIC_WIFI_MEMORY_PROFILE=1

custom_sdkconfig =
    CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
    CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
    CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
    CONFIG_ESP_WIFI_IRAM_OPT=n
    CONFIG_ESP_WIFI_RX_IRAM_OPT=n
    CONFIG_TINYUSB_AUDIO_ENABLED=n
    CONFIG_TINYUSB_NCM_ENABLED=n

# Complete synthetic product candidate. This does not select ordinary QA files.
[env:tdongle_s3_product_lab]
extends = env:tdongle_s3_public_wifi_mem1
build_flags =
    ${env:tdongle_s3_public_wifi_mem1.build_flags}
    -DCSP_PRODUCT_LAB_PROFILE=1
    -DCSP_ENABLE_EVENT_LOG=1

# Distinct artifact identity for the public handoff clock-order correction.
[env:tdongle_s3_product_lab2]
extends = env:tdongle_s3_product_lab
build_flags =
    ${env:tdongle_s3_product_lab.build_flags}
    -DCSP_PRODUCT_LAB2_PROFILE=1

# Active-transfer handoff regression and numeric transport diagnostics.
[env:tdongle_s3_product_lab3]
extends = env:tdongle_s3_product_lab2
build_flags =
    ${env:tdongle_s3_product_lab2.build_flags}
    -DCSP_PRODUCT_LAB3_PROFILE=1
    -DCSP_UPLOAD_DIAGNOSTICS=1
    -Wl,--wrap=mbedtls_ssl_write
    -Wl,--wrap=mbedtls_ssl_read
    -Wl,--wrap=mbedtls_net_send

# Synthetic acceptance of bounded private receipts and remote health. The
# default build and earlier reviewed image identities keep both additions off.
[env:tdongle_s3_product_lab4]
extends = env:tdongle_s3_product_lab3
build_flags =
    ${env:tdongle_s3_product_lab3.build_flags}
    -DCSP_PRODUCT_LAB4_PROFILE=1
    -DCSP_ENABLE_FILE_HISTORY=1
    -DCSP_ENABLE_REMOTE_HEALTH=1
    -DCSP_PANIC_DIAGNOSTICS=1
    -Wl,--wrap=esp_panic_handler

# Distinct image for the verified project-side NimBLE shutdown backport.
# SDK packages remain immutable; earlier profile identities keep repair off.
[env:tdongle_s3_product_lab5]
extends = env:tdongle_s3_product_lab4
build_flags =
    ${env:tdongle_s3_product_lab4.build_flags}
    -DCSP_PRODUCT_LAB5_PROFILE=1
    -DCSP_NIMBLE_STOP_REPAIR=1

# Numeric route failure diagnosis only; no portal or ownership policy change.
[env:tdongle_s3_product_lab6]
extends = env:tdongle_s3_product_lab5
build_flags =
    ${env:tdongle_s3_product_lab5.build_flags}
    -DCSP_PRODUCT_LAB6_PROFILE=1

# Accept a proved completed configuration restart; retain every Active STOP.
[env:tdongle_s3_product_lab7]
extends = env:tdongle_s3_product_lab6
build_flags =
    ${env:tdongle_s3_product_lab6.build_flags}
    -DCSP_PRODUCT_LAB7_PROFILE=1

# Ordinary saved-folder candidate, separate from every fixture-only lab image.
# USB maintenance remains local to the attached host; all BLE configuration
# writes still require the private owner proof. Build only through the guard.
[env:tdongle_s3_product_rc1]
extends = env:tdongle_s3_backup_wifi_bench
build_flags =
    ${env:tdongle_s3_backup_wifi_bench.build_flags}
    -DCSP_PRODUCT_RC_PROFILE=1
    -DCSP_BACKUP_FIXTURE_ONLY=0
    -DCSP_ENABLE_PUBLIC_WIFI_ASSISTANCE=1
    -DCSP_ENABLE_OWNED_GUEST_ROUTE=1
    -DCSP_PUBLIC_WIFI_MEMORY_PROFILE=1
    -DCSP_ENABLE_EVENT_LOG=1
    -DCSP_ENABLE_FILE_HISTORY=1
    -DCSP_ENABLE_REMOTE_HEALTH=1
    -DCSP_NIMBLE_STOP_REPAIR=1
custom_sdkconfig = ${env:tdongle_s3_public_wifi_mem1.custom_sdkconfig}

# Local read-only LAN dashboard, with distinct image identity and separate
# physical memory/USB acceptance. RC1 and the default environment stay unchanged.
[env:tdongle_s3_product_dashboard1]
extends = env:tdongle_s3_product_rc1
build_flags =
    ${env:tdongle_s3_product_rc1.build_flags}
    -DCSP_PRODUCT_DASHBOARD_TRIAL=1
    -DCSP_ENABLE_LOCAL_DASHBOARD=1

# One-variable upload experiment: corrected pinned stream body and 4096-byte TX
# chunk, with the local dashboard disabled for a matched baseline comparison.
[env:tdongle_s3_product_speed1]
extends = env:tdongle_s3_product_rc1
build_flags =
    ${env:tdongle_s3_product_rc1.build_flags}
    -DCSP_PRODUCT_SPEED_TRIAL=1
    -DCSP_UPLOAD_THROUGHPUT_TRIAL=1
    -DCSP_UPLOAD_TX_BYTES=4096

# Corrected original-size stream and managed awake-radio policy. This compares
# against the measured 4096-byte/awake run without enabling the dashboard.
[env:tdongle_s3_product_speed2]
extends = env:tdongle_s3_product_rc1
build_flags =
    ${env:tdongle_s3_product_rc1.build_flags}
    -DCSP_PRODUCT_SPEED2_PROFILE=1
    -DCSP_PRODUCT_SPEED_TRIAL=1
    -DCSP_UPLOAD_THROUGHPUT_TRIAL=1
    -DCSP_UPLOAD_TX_BYTES=1460
    -DCSP_BACKUP_WIFI_AWAKE=1

# Combined candidate retains the corrected stream path when adding the local
# dashboard. It never reintroduces the pinned original cancellation defect.
[env:tdongle_s3_product_rc2]
extends = env:tdongle_s3_product_rc1
build_flags =
    ${env:tdongle_s3_product_rc1.build_flags}
    -DCSP_PRODUCT_RC2_PROFILE=1
    -DCSP_PRODUCT_SPEED_TRIAL=1
    -DCSP_UPLOAD_THROUGHPUT_TRIAL=1
    -DCSP_PRODUCT_DASHBOARD_TRIAL=1
    -DCSP_ENABLE_LOCAL_DASHBOARD=1
    -DCSP_UPLOAD_TX_BYTES=1460
    -DCSP_BACKUP_WIFI_AWAKE=1

# Integrated ordinary-folder product candidate. Separate identity keeps every
# previous reviewed image reproducible and leaves default production unchanged.
[env:tdongle_s3_product_rc3]
extends = env:tdongle_s3_product_rc1
build_flags =
    ${env:tdongle_s3_product_rc1.build_flags}
    -DCSP_PRODUCT_RC3_PROFILE=1
    -DCSP_PRODUCT_SPEED_TRIAL=1
    -DCSP_UPLOAD_THROUGHPUT_TRIAL=1
    -DCSP_PRODUCT_DASHBOARD_TRIAL=1
    -DCSP_ENABLE_LOCAL_DASHBOARD=1
    -DCSP_UPLOAD_TX_BYTES=1460
    -DCSP_BACKUP_WIFI_AWAKE=1
    -DCSP_ENABLE_OWNER_CLOUD_SETUP=1
    -DCSP_ENABLE_OWNER_LOGIN=1
    -DCSP_ENABLE_SCAN_IDLE_GATE=1
    -DCSP_ENABLE_LCD_V2=1
    -DCSP_DASHBOARD_PASSIVE_CLOSE=1

# Opt-in incremental content-proof candidate. The existing default stays off;
# historical images retain their identities and receipts keep their old format.
[env:tdongle_s3_product_incremental_dev]
extends = env:tdongle_s3_product_setup_dev
build_flags =
    ${env:tdongle_s3_product_setup_dev.build_flags}
    -DCSP_PRODUCT_INCREMENTAL_DEV_PROFILE=1
    -DCSP_ENABLE_FILE_INCREMENTAL_CACHE=1

# Presentation-only follow-up; retain the exact incremental backup/storage path.
[env:tdongle_s3_product_ui_dev]
extends = env:tdongle_s3_product_incremental_dev
build_flags =
    ${env:tdongle_s3_product_incremental_dev.build_flags}
    -DCSP_PRODUCT_UI_DEV_PROFILE=1

# Fair saved-network retries, with a distinct candidate identity.
[env:tdongle_s3_product_wifi_dev]
extends = env:tdongle_s3_product_ui_dev
build_flags =
    ${env:tdongle_s3_product_ui_dev.build_flags}
    -DCSP_PRODUCT_WIFI_DEV_PROFILE=1
    -DCSP_ENABLE_WIFI_FAIR_RETRY=1

# Delayed authenticated BLE cleanup, retaining the existing closing deadline.
[env:tdongle_s3_product_ble_dev]
extends = env:tdongle_s3_product_wifi_dev
build_flags =
    ${env:tdongle_s3_product_wifi_dev.build_flags}
    -DCSP_PRODUCT_BLE_DEV_PROFILE=1
    -DCSP_ENABLE_BLE_RELEASE_SETTLEMENT=1

# NVS RAM-cache release after verified setup teardown; flash bytes stay equal.
[env:tdongle_s3_product_cache_dev]
extends = env:tdongle_s3_product_ble_dev
build_flags =
    ${env:tdongle_s3_product_ble_dev.build_flags}
    -DCSP_PRODUCT_CACHE_DEV_PROFILE=1
    -DCSP_ENABLE_BLE_NVS_CACHE_RELEASE=1

# Private physical cache/failover service fixture; never a release binary.
[env:tdongle_s3_product_cache_lab]
extends = env:tdongle_s3_product_cache_dev
build_flags =
    ${env:tdongle_s3_product_cache_dev.build_flags}
    -DCSP_PRODUCT_CACHE_LAB_PROFILE=1
    -DCSP_NVS_CACHE_LAB=1

# Receipt-inventory proof follow-up; the RC3 environment remains unchanged.
[env:tdongle_s3_product_rc4]
extends = env:tdongle_s3_product_rc1
build_flags =
    ${env:tdongle_s3_product_rc1.build_flags}
    -DCSP_PRODUCT_RC4_PROFILE=1
    -DCSP_PRODUCT_SPEED_TRIAL=1
    -DCSP_UPLOAD_THROUGHPUT_TRIAL=1
    -DCSP_PRODUCT_DASHBOARD_TRIAL=1
    -DCSP_ENABLE_LOCAL_DASHBOARD=1
    -DCSP_UPLOAD_TX_BYTES=1460
    -DCSP_BACKUP_WIFI_AWAKE=1
    -DCSP_ENABLE_OWNER_CLOUD_SETUP=1
    -DCSP_ENABLE_OWNER_LOGIN=1
    -DCSP_ENABLE_SCAN_IDLE_GATE=1
    -DCSP_ENABLE_LCD_V2=1
    -DCSP_DASHBOARD_PASSIVE_CLOSE=1

# Health-only Koofr response compatibility; RC4 flags remain reproducible.
[env:tdongle_s3_product_rc5]
extends = env:tdongle_s3_product_rc1
build_flags =
    ${env:tdongle_s3_product_rc1.build_flags}
    -DCSP_PRODUCT_RC5_PROFILE=1
    -DCSP_PRODUCT_SPEED_TRIAL=1
    -DCSP_UPLOAD_THROUGHPUT_TRIAL=1
    -DCSP_PRODUCT_DASHBOARD_TRIAL=1
    -DCSP_ENABLE_LOCAL_DASHBOARD=1
    -DCSP_UPLOAD_TX_BYTES=1460
    -DCSP_BACKUP_WIFI_AWAKE=1
    -DCSP_ENABLE_OWNER_CLOUD_SETUP=1
    -DCSP_ENABLE_OWNER_LOGIN=1
    -DCSP_ENABLE_SCAN_IDLE_GATE=1
    -DCSP_ENABLE_LCD_V2=1
    -DCSP_DASHBOARD_PASSIVE_CLOSE=1

# Source-only setup-duration candidate. Historical RC5 keeps its own identity.
[env:tdongle_s3_product_setup_dev]
extends = env:tdongle_s3_product_rc1
build_flags =
    ${env:tdongle_s3_product_rc1.build_flags}
    -DCSP_PRODUCT_SETUP_DEV_PROFILE=1
    -DCSP_PRODUCT_SPEED_TRIAL=1
    -DCSP_UPLOAD_THROUGHPUT_TRIAL=1
    -DCSP_PRODUCT_DASHBOARD_TRIAL=1
    -DCSP_ENABLE_LOCAL_DASHBOARD=1
    -DCSP_UPLOAD_TX_BYTES=1460
    -DCSP_BACKUP_WIFI_AWAKE=1
    -DCSP_ENABLE_OWNER_CLOUD_SETUP=1
    -DCSP_ENABLE_OWNER_LOGIN=1
    -DCSP_ENABLE_SCAN_IDLE_GATE=1
    -DCSP_ENABLE_LCD_V2=1
    -DCSP_DASHBOARD_PASSIVE_CLOSE=1

# Private allocation-metadata observer; no synthetic NVS writes, never released.
[env:tdongle_s3_product_release_lab]
extends = env:tdongle_s3_product_cache_dev
build_flags =
    ${env:tdongle_s3_product_cache_dev.build_flags}
    -DCSP_PRODUCT_RELEASE_LAB_PROFILE=1
    -DCSP_BLE_RELEASE_DIAGNOSTICS=1
    -Wl,--wrap=malloc
    -Wl,--wrap=calloc
    -Wl,--wrap=free
    -Wl,--wrap=heap_caps_malloc
    -Wl,--wrap=heap_caps_calloc
    -Wl,--wrap=heap_caps_free

# Authenticated trusted-phone Wi-Fi wake; physical pairing is still required.
[env:tdongle_s3_product_wake_dev]
extends = env:tdongle_s3_product_cache_dev
build_flags =
    ${env:tdongle_s3_product_cache_dev.build_flags}
    -DCSP_PRODUCT_WAKE_DEV_PROFILE=1
    -DCSP_ENABLE_BLE_WIFI_WAKE=1

# Bounded LAN address discovery; stops with the dashboard before BLE.
[env:tdongle_s3_product_discovery_dev]
extends = env:tdongle_s3_product_wake_dev
build_flags =
    ${env:tdongle_s3_product_wake_dev.build_flags}
    -DCSP_ENABLE_LOCAL_DISCOVERY=1

# Advisory folder setup reuse; a separately identified, unaccepted candidate.
[env:tdongle_s3_product_upload_dev]
extends = env:tdongle_s3_product_discovery_dev
build_flags =
    ${env:tdongle_s3_product_discovery_dev.build_flags}
    -DCSP_PRODUCT_UPLOAD_DEV_PROFILE=1
    -DCSP_ENABLE_DAV_COLLECTION_CACHE=1
    -DCSP_ENABLE_CLOUD_REQUEST_TRACE=1
    -DCSP_ENABLE_CLOUD_TLS_TRACE=1
    -Wl,--wrap=mbedtls_ssl_read
