# Example only: this location does not activate GitHub Actions.
# Enable separately under .github/workflows after reviewing release policy.
name: Cloud Stick Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned native build dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Build Windows executable and ZIP
        run: .\tools\build-windows.ps1 -Python .\.venv\Scripts\python.exe
      - name: Synthetic native window smoke test
        run: |
          $app = Start-Process -FilePath .\dist\cloud-stick\cloud-stick.exe -ArgumentList '--smoke-test','--report','windows-smoke.json','--screenshot','windows-smoke.png' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Native smoke test failed" }
          if (-not (Test-Path windows-smoke.json)) { throw "Missing smoke report" }
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-stick-windows-x64
          path: |
            desktop/dist/releases/*
            desktop/windows-smoke.json
            desktop/windows-smoke.png
          if-no-files-found: error

