name: Public repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday 13:23 UTC; this checks the repository, never the USB or cloud account.
    - cron: '23 13 * * 1'

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the proposed public tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the publication checker
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check approved files and local documentation links
        run: python3 .github/scripts/check_public_repository.py

  companion-interfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the proposed companion source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the runner's JavaScript test runtime
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
      - name: Test desktop interface logic without Qt or a device
        run: node --test desktop/tests/frontend-*.test.mjs
      - name: Test Android interface logic without a phone
        run: node --test android/tests/*.test.mjs

  saved-wifi-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the proposed Wi-Fi policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test saved-network retry order and cooldowns without hardware
        run: python3 tools/test_wifi_reconnect.py

  nvs-cache-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the proposed cache cleanup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test actual cleanup and service-fixture sources with synthetic SDK and flash
        run: python3 tools/test_nvs_cache_release.py
      - name: Test actual feature-header admission without a device
        run: python3 test/product_rc/profile.test.py

  upstream-notice:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out the trusted default-branch monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check official upstream revision and license availability
        run: python3 .github/scripts/check_upstream_status.py
