name: Native desktop installers
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop-native.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Fetch the exact reviewed offline firmware package
        run: python desktop/packaging/fetch_firmware.py desktop/firmware
      - name: Verify the signature and every bundled image
        run: python desktop/packaging/verify_firmware.py desktop/firmware
      - name: Linux graphics/runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sed -E '/^\s*(#|$)/d; s/ \(.*\)//' desktop/packaging/linux/runtime-packages.txt | xargs sudo apt-get install -y --no-install-recommends
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Native unit and injected-fault tests; no device access
        env:
          QT_QPA_PLATFORM: offscreen
        run: python desktop/tests/run_native_tests.py
      - name: Linux package
        if: runner.os == 'Linux'
        run: CLOUDSTICK_PYTHON=python sh desktop/tools/build-linux.sh
      - name: Windows EXE, ZIP and per-user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Required native Inno Setup compiler is missing' }
          ./desktop/tools/build-windows.ps1 -Python python -InnoSetupCompiler $compiler
      - name: Linux packaged installer self-test, no hardware
        if: runner.os == 'Linux'
        run: desktop/dist/cloud-stick/firmware-helper/cloud-stick-installer --self-test --report desktop/installer-self-test.json
      - name: Windows packaged installer self-test, no hardware
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $helper = Start-Process -FilePath ./desktop/dist/cloud-stick/firmware-helper/cloud-stick-installer.exe -ArgumentList '--self-test','--report','desktop/installer-self-test.json' -Wait -PassThru
          if ($helper.ExitCode -ne 0) { throw 'Packaged installer self-test failed' }
          if (-not (Test-Path desktop/installer-self-test.json)) { throw 'Missing installer self-test report' }
      - name: Linux packaged window smoke, no hardware
        if: runner.os == 'Linux'
        run: xvfb-run -a desktop/dist/cloud-stick/cloud-stick --smoke-test --smoke-panel firmware --report desktop/native-smoke.json --screenshot desktop/native-smoke.png
      - name: Windows packaged window smoke, no hardware
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ./desktop/dist/cloud-stick/cloud-stick.exe -ArgumentList '--smoke-test','--smoke-panel','firmware','--report','desktop/native-smoke.json','--screenshot','desktop/native-smoke.png' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Native window smoke failed' }
          if (-not (Test-Path desktop/native-smoke.json)) { throw 'Missing native smoke report' }
      - name: Windows per-user installation, installed programs and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/packaging/test-windows-install.ps1
      - name: Read the built component version
        id: component
        shell: python
        run: |
          import os, tomllib
          with open('desktop/pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('version=' + version + '\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-stick-${{ steps.component.outputs.version }}-${{ runner.os }}-x64
          path: |
            desktop/dist/releases/*
            desktop/installer-self-test.json
            desktop/native-smoke.json
            desktop/native-smoke.png
            desktop/installed-*
            desktop/windows-install-test.json
          if-no-files-found: error
          retention-days: 14
