name: Suggest an improvement
description: Explain the user task that should become easier.
title: '[Idea] '
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the task and what gets in the way. No coding knowledge is needed.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful result look like?
      description: Keep the proposal focused. Do not include private files, passwords or account details.
    validations:
      required: true
